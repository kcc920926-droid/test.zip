<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1530" viewBox="0 0 420 1530" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">test.zip — 스킬 구조와 실행 모드 · 모바일</title>
<desc id="diagram-desc">기본 규칙은 SKILL.md, 상세 기준은 필요할 때만 읽는 selective-validation.md에 있습니다. 전체 빠른 검사 시간을 기준으로 Simple, Light 또는 Selective 후보를 정하고, 위험에 필요한 검증은 모든 모드에 추가합니다. 시간은 조정 가능한 초기 기준입니다.</desc>

  <style>
    :root { --bg:#f6f8fc; --panel:#ffffff; --ink:#18233d; --muted:#506079; --line:#d8e0ec; --accent:#3155c6; --tint:#eaf0ff; --green:#146a55; --green-bg:#eaf7f0; --amber:#8b5718; --amber-bg:#fff3df; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101827; --panel:#192439; --ink:#edf2ff; --muted:#b4c1d9; --line:#3e4f6b; --accent:#a7baff; --tint:#263858; --green:#9ce2c5; --green-bg:#203c38; --amber:#f7d092; --amber-bg:#3f3324; } }
    text { font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:var(--ink); }
    .bg { fill:var(--bg); } .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .tint { fill:var(--tint); } .muted { fill:var(--muted); } .accent { fill:var(--accent); }
    .green { fill:var(--green); } .greenbg { fill:var(--green-bg); }
    .amber { fill:var(--amber); } .amberbg { fill:var(--amber-bg); }
    .arrow { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; }
    .rule { stroke:var(--line); stroke-width:1.5; }
  </style>
  <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs>

<rect x="0" y="0" width="420" height="1530" rx="24" class="bg"/>
<text x="24" y="43" font-size="16" font-weight="700" class="accent">ADAPTIVE TESTING</text><text x="24" y="90" font-size="30" font-weight="700" class="">작을 때는 단순하게,</text><text x="24" y="131" font-size="30" font-weight="700" class="">커지면 선택적으로.</text><text x="24" y="164" font-size="16" font-weight="400" class="muted">기존 테스트 명령을 활용하는 에이전트 지침</text><text x="24" y="212" font-size="22" font-weight="700" class="">01  필요한 규칙만 읽기</text><rect x="24" y="230" width="372" height="119" rx="18" class="panel"/><text x="44" y="264" font-size="23" font-weight="700" class="accent">SKILL.md</text><text x="44" y="296" font-size="17" font-weight="400" class="">기본 판단 · 위험별 검증 · 중복 실행 방지</text><text x="44" y="325" font-size="17" font-weight="400" class="muted">스킬을 적용할 때 읽습니다.</text><path d="M 210 359 V 408" class="arrow" marker-end="url(#arrowhead)"/><text x="233" y="388" font-size="17" font-weight="600" class="accent">필요할 때</text><rect x="24" y="420" width="372" height="122" rx="18" class="panel"/><text x="44" y="454" font-size="22" font-weight="700" class="accent">selective-validation.md</text><text x="44" y="486" font-size="17" font-weight="400" class="">비용 계산 · 영향 범위 · 캐시와 CI 조건</text><text x="44" y="514" font-size="17" font-weight="400" class="muted">선택 실행이나 불확실성을 검토할 때</text><text x="24" y="574" font-size="17" font-weight="600" class="muted">agents/openai.yaml</text><text x="24" y="600" font-size="17" font-weight="400" class="muted">목록에 표시할 이름과 짧은 설명</text><text x="24" y="650" font-size="22" font-weight="700" class="">02  실제 비용으로 모드 선택</text><text x="24" y="681" font-size="17" font-weight="400" class="muted">전체 빠른 검사 시간 기준 · Full E2E 제외</text><rect x="24" y="700" width="372" height="144" rx="18" class="panel"/><rect x="42" y="716" width="336" height="30" rx="8" class="greenbg"/><text x="54" y="738" font-size="17" font-weight="700" class="green">30초 이내 · 미측정</text><text x="44" y="779" font-size="24" font-weight="700" class="">Simple</text><text x="44" y="807" font-size="18" font-weight="400" class="">빠른 검사 전체 실행</text><text x="44" y="832" font-size="17" font-weight="400" class="muted">영향 분석 생략</text><rect x="24" y="858" width="372" height="144" rx="18" class="panel"/><rect x="42" y="874" width="336" height="30" rx="8" class="tint"/><text x="54" y="896" font-size="17" font-weight="700" class="accent">30초 초과 ~ 90초</text><text x="44" y="937" font-size="24" font-weight="700" class="">Light</text><text x="44" y="965" font-size="18" font-weight="400" class="">기존 패키지·파일 필터 활용</text><text x="44" y="990" font-size="17" font-weight="400" class="muted">새 분석 도구 도입 없음</text><rect x="24" y="1016" width="372" height="144" rx="18" class="panel"/><rect x="42" y="1032" width="336" height="30" rx="8" class="amberbg"/><text x="54" y="1054" font-size="17" font-weight="700" class="amber">90초를 반복해서 초과</text><text x="44" y="1095" font-size="24" font-weight="700" class="">Selective 후보</text><text x="44" y="1123" font-size="18" font-weight="400" class="">판단·구축·유지 비용까지 비교</text><text x="44" y="1148" font-size="17" font-weight="400" class="muted">총비용이 줄어들 때만 도입</text><rect x="24" y="1182" width="372" height="137" rx="18" class="tint"/><text x="44" y="1217" font-size="22" font-weight="700" class="accent">03  필요한 검증은 유지</text><text x="44" y="1249" font-size="18" font-weight="400" class="">인증 · 권한 · 결제 · migration 등은</text><text x="44" y="1277" font-size="18" font-weight="400" class="">프로젝트가 작아도 병합 전에 확인.</text><text x="44" y="1303" font-size="16" font-weight="400" class="muted">이 원칙은 모든 모드에 적용합니다.</text><text x="24" y="1360" font-size="21" font-weight="700" class="">실행 원칙</text><text x="24" y="1392" font-size="18" font-weight="400" class="">입력이 같을 때만 성공 결과 재사용</text><text x="24" y="1422" font-size="18" font-weight="400" class="">실패는 재현부터 · Full E2E는 기본 CI</text><line x1="24" y1="1446" x2="396" y2="1446" class="rule"/><text x="24" y="1480" font-size="16" font-weight="400" class="muted">30초·90초는 조정 가능한 초기 기준입니다.</text><text x="24" y="1506" font-size="16" font-weight="400" class="muted">측정만을 위한 반복 실행은 하지 않습니다.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="930" viewBox="0 0 1120 930" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">test.zip — 스킬 구조와 실행 모드</title>
<desc id="diagram-desc">기본 규칙은 SKILL.md, 상세 기준은 필요할 때만 읽는 selective-validation.md에 있습니다. 전체 빠른 검사 시간을 기준으로 Simple, Light 또는 Selective 후보를 정하고, 위험에 필요한 검증은 모든 모드에 추가합니다. 시간은 조정 가능한 초기 기준입니다.</desc>

  <style>
    :root { --bg:#f6f8fc; --panel:#ffffff; --ink:#18233d; --muted:#506079; --line:#d8e0ec; --accent:#3155c6; --tint:#eaf0ff; --green:#146a55; --green-bg:#eaf7f0; --amber:#8b5718; --amber-bg:#fff3df; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101827; --panel:#192439; --ink:#edf2ff; --muted:#b4c1d9; --line:#3e4f6b; --accent:#a7baff; --tint:#263858; --green:#9ce2c5; --green-bg:#203c38; --amber:#f7d092; --amber-bg:#3f3324; } }
    text { font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif; fill:var(--ink); }
    .bg { fill:var(--bg); } .panel { fill:var(--panel); stroke:var(--line); stroke-width:1.5; }
    .tint { fill:var(--tint); } .muted { fill:var(--muted); } .accent { fill:var(--accent); }
    .green { fill:var(--green); } .greenbg { fill:var(--green-bg); }
    .amber { fill:var(--amber); } .amberbg { fill:var(--amber-bg); }
    .arrow { fill:none; stroke:var(--accent); stroke-width:2.5; stroke-linejoin:round; }
    .rule { stroke:var(--line); stroke-width:1.5; }
  </style>
  <defs><marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/></marker></defs>

<rect x="0" y="0" width="1120" height="930" rx="24" class="bg"/>
<text x="36" y="44" font-size="18" font-weight="700" class="accent">ADAPTIVE TESTING</text><text x="36" y="101" font-size="36" font-weight="700" class="">작을 때는 단순하게, 커지면 선택적으로.</text><text x="36" y="137" font-size="19" font-weight="400" class="muted">기존 테스트 명령을 활용하는 에이전트 지침 · 자동 실행 엔진이 아닙니다.</text><text x="36" y="189" font-size="22" font-weight="700" class="">01  필요한 규칙만 읽기</text><rect x="36" y="211" width="430" height="122" rx="18" class="panel"/><text x="60" y="248" font-size="24" font-weight="700" class="accent">SKILL.md</text><text x="60" y="281" font-size="19" font-weight="400" class="">기본 판단 · 위험별 검증 · 중복 실행 방지</text><text x="60" y="310" font-size="18" font-weight="400" class="muted">스킬을 적용할 때 읽습니다.</text><rect x="624" y="211" width="460" height="122" rx="18" class="panel"/><text x="648" y="248" font-size="23" font-weight="700" class="accent">selective-validation.md</text><text x="648" y="281" font-size="19" font-weight="400" class="">비용 계산 · 영향 범위 · 캐시와 CI 조건</text><text x="648" y="310" font-size="18" font-weight="400" class="muted">선택 실행이나 불확실성을 검토할 때 읽습니다.</text><path d="M 481 276 L 607 276" class="arrow" marker-end="url(#arrowhead)"/><text x="503" y="256" font-size="18" font-weight="600" class="accent">필요할 때</text><text x="36" y="365" font-size="18" font-weight="400" class="muted">agents/openai.yaml  →  목록에 표시할 이름과 짧은 설명</text><text x="36" y="416" font-size="22" font-weight="700" class="">02  실제 비용으로 모드 선택</text><text x="36" y="448" font-size="18" font-weight="400" class="muted">기준: 전체 빠른 검사 시간 · lint / typecheck / unit 등 · Full E2E 제외</text><rect x="36" y="473" width="324" height="170" rx="18" class="panel"/><rect x="54" y="491" width="288" height="35" rx="8" class="greenbg"/><text x="66" y="516" font-size="18" font-weight="700" class="green">30초 이내 · 미측정</text><text x="60" y="561" font-size="25" font-weight="700" class="">Simple</text><text x="60" y="596" font-size="18" font-weight="400" class="">빠른 검사 전체 실행</text><text x="60" y="625" font-size="18" font-weight="400" class="muted">영향 분석 생략</text><rect x="398" y="473" width="324" height="170" rx="18" class="panel"/><rect x="416" y="491" width="288" height="35" rx="8" class="tint"/><text x="428" y="516" font-size="18" font-weight="700" class="accent">30초 초과 ~ 90초</text><text x="422" y="561" font-size="25" font-weight="700" class="">Light</text><text x="422" y="596" font-size="18" font-weight="400" class="">기존 패키지·파일 필터 활용</text><text x="422" y="625" font-size="18" font-weight="400" class="muted">새 분석 도구 도입 없음</text><rect x="760" y="473" width="324" height="170" rx="18" class="panel"/><rect x="778" y="491" width="288" height="35" rx="8" class="amberbg"/><text x="790" y="516" font-size="18" font-weight="700" class="amber">90초를 반복해서 초과</text><text x="784" y="561" font-size="25" font-weight="700" class="">Selective 후보</text><text x="784" y="596" font-size="18" font-weight="400" class="">판단·구축·유지 비용까지 비교</text><text x="784" y="625" font-size="18" font-weight="400" class="muted">총비용이 줄어들 때만 도입</text><path d="M 198 643 V 665 H 922 V 643 M 560 643 V 665" class="arrow"/><path d="M 560 665 V 709" class="arrow" marker-end="url(#arrowhead)"/><text x="582" y="694" font-size="18" font-weight="600" class="accent">위험에 따른 검사 추가</text><rect x="36" y="720" width="1048" height="81" rx="18" class="tint"/><text x="60" y="752" font-size="22" font-weight="700" class="accent">03  필요한 검증은 모든 모드에서 유지</text><text x="60" y="783" font-size="19" font-weight="400" class="">인증 · 권한 · 결제 · migration 등은 프로젝트가 작아도 병합 전에 확인합니다.</text><text x="36" y="847" font-size="20" font-weight="700" class="">실행 원칙</text><text x="177" y="847" font-size="18" font-weight="400" class="muted">입력이 같을 때만 성공 결과 재사용  /  실패는 재현부터  /  Full E2E는 기본 CI</text><line x1="36" y1="869" x2="1084" y2="869" class="rule"/><text x="36" y="903" font-size="18" font-weight="400" class="muted">30초·90초는 조정 가능한 초기 기준입니다. 측정만을 위한 반복 실행은 하지 않습니다.</text>
</svg>